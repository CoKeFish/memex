# nginx del dashboard: sirve el SPA y proxya la API. Espeja el proxy de dev de Vite
# (frontend/vite.config.ts): el browser pega a /api/* del MISMO origen y acá se reenvía al
# contenedor `api` (puerto 8787) quitando el prefijo /api → sin CORS, mismo contrato en dev y prod.

server {
    listen 80;
    server_name _;

    # El SPA: cualquier ruta que no sea un archivo real cae en index.html (routing del lado
    # cliente). Sin esto, recargar en /cuenta o /calendario daría 404.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API: /api/foo → http://api:8787/foo.
    #
    # El upstream va en una VARIABLE a propósito. Con un nombre literal (`proxy_pass http://api:...`)
    # nginx resuelve el DNS al CARGAR la config: si el contenedor `api` todavía no está en la red
    # (arranque del PC, `compose up` recreando), nginx aborta con "host not found in upstream" y el
    # dashboard queda caído; y si `api` se recrea con otra IP, nginx sigue pegándole a la vieja. Con
    # variable + `resolver`, la resolución es por request contra el DNS interno de Docker (127.0.0.11).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $memex_api http://api:8787;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $memex_api;

        # Subida de documentos: nginx corta en 1 MB por default (413) y la API acepta hasta
        # MEMEX_DOCUMENTOS_MAX_MB; que el tope lo ponga la API, no el proxy.
        client_max_body_size 200m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming del asistente (SSE) y respuestas largas: sin buffering para que fluyan.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Assets con hash en el nombre: cache larga. index.html nunca se cachea (para tomar un deploy
    # nuevo sin ctrl-shift-R).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
